<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAPCo Login Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;margin:0;padding:24px;max-width:720px}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px}
    button{padding:12px 16px;border-radius:999px;border:none;background:#512888;color:#fff;font-weight:700;cursor:pointer}
    pre{background:#f7f7f7;padding:12px;border-radius:8px;overflow:auto}
    label{display:block;margin:.5rem 0 .25rem;font-weight:600}
    input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}
  </style>
</head>
<body>
  <h1>LAPCo Google Login Test</h1>
  <p>Paste your Supabase values, save, then click the button to test Google sign-in.</p>

  <div class="card">
    <label>SUPABASE URL</label>
    <input id="url" placeholder="https://YOUR-REF.supabase.co" />

    <label>Publishable (Web) Key</label>
    <input id="key" placeholder="Your publishable key" />

    <div style="margin-top:12px">
      <button id="save">Save</button>
      <button id="google" style="margin-left:8px">Continue with Google</button>
      <button id="signout" style="margin-left:8px;background:#444">Sign out</button>
    </div>
  </div>

  <h3>Session</h3>
  <pre id="out">(not signed in)</pre>

<script>
  const out = document.getElementById('out');
  const urlEl = document.getElementById('url');
  const keyEl = document.getElementById('key');
  const saveBtn = document.getElementById('save');
  const googleBtn = document.getElementById('google');
  const signoutBtn = document.getElementById('signout');

  // load saved
  const saved = JSON.parse(localStorage.getItem('lapco_supa') || '{}');
  urlEl.value = saved.url || '';
  keyEl.value = saved.key || '';

  let supa = null;

  function ensureClient(){
    const url = urlEl.value.trim();
    const key = keyEl.value.trim();
    if(!url || !key){ alert('Enter SUPABASE URL and Publishable key'); return null; }
    supa = window.supabase.createClient(url, key);
    return supa;
  }

  saveBtn.onclick = ()=>{
    localStorage.setItem('lapco_supa', JSON.stringify({url:urlEl.value.trim(), key:keyEl.value.trim()}));
    alert('Saved! Now click "Continue with Google".');
  };

  googleBtn.onclick = async ()=>{
    if(!ensureClient()) return;
    await supa.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
  };

  signoutBtn.onclick = async ()=>{
    if(!ensureClient()) return;
    await supa.auth.signOut();
    out.textContent = '(signed out)';
  };

  async function checkSession(){
    if(!ensureClient()) return;
    const { data: { session } } = await supa.auth.getSession();
    out.textContent = session ? JSON.stringify(session, null, 2) : '(no session)';
  }
  checkSession();
</script>
</body>
</html>
